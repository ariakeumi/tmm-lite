{{define "content"}}
<h1>匹配 · {{.Library.Name}}</h1>
<p class="muted">使用解析出的文件名搜索 TMDB,查看按评分排序的候选并确认匹配——
在你确认之前不会写入任何内容。</p>

{{if not .Rows}}
  <section class="panel"><p class="muted empty">还没有媒体文件——请先在
  <a href="/settings">设置</a>页面扫描该库。</p></section>
{{else}}
<table class="libraries">
  <thead>
    <tr><th>文件</th><th>解析结果</th><th>状态</th><th>操作</th></tr>
  </thead>
  <tbody>
    {{range .Rows}}{{template "match_row" .}}{{end}}
  </tbody>
</table>
{{end}}
{{end}}
