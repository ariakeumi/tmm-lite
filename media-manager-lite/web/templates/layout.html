{{define "layout"}}<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} · Media Manager Lite</title>
<link rel="stylesheet" href="/static/style.css">
<script src="https://unpkg.com/htmx.org@2.0.4" defer></script>
</head>
<body>
<header class="topbar">
  <a class="brand" href="/">Media Manager <span>Lite</span></a>
  <nav>
    <a href="/" {{if eq .Nav "dashboard"}}class="active"{{end}}>仪表盘</a>
    <a href="/libraries" {{if eq .Nav "libraries"}}class="active"{{end}}>媒体库</a>
    <a href="/movies" {{if eq .Nav "movies"}}class="active"{{end}}>电影</a>
    <a href="/tv" {{if eq .Nav "tv"}}class="active"{{end}}>电视剧</a>
    <a href="/settings" {{if eq .Nav "settings"}}class="active"{{end}}>设置</a>
  </nav>
</header>
<main class="container">
{{block "content" .}}{{end}}
</main>
<footer class="container footer">
  Media Manager Lite {{.BuildVersion}} · <a href="/api/health">health</a> · <a href="/api/version">version</a>
</footer>
</body>
</html>{{end}}
