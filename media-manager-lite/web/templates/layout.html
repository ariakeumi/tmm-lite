{{define "layout"}}<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} · Media Manager Lite</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎬</text></svg>">
<link rel="stylesheet" href="/static/style.css">
<script src="https://unpkg.com/htmx.org@2.0.4" defer></script>
</head>
<body>
<header class="topbar">
  <a class="brand" href="/">Media Manager <span>Lite</span></a>
  <nav>
    <a href="/movies" {{if eq .Nav "movies"}}class="active"{{end}}>电影</a>
    <a href="/tv" {{if eq .Nav "tv"}}class="active"{{end}}>电视剧</a>
    <a href="/settings" {{if eq .Nav "settings"}}class="active"{{end}}>设置</a>
  </nav>
</header>
<main class="container">
{{block "content" .}}{{end}}
</main>
<dialog id="modal" class="modal">
  <div id="modal-content"></div>
</dialog>
<script>
function openModal()  { document.getElementById('modal').showModal(); }
function closeModal() { document.getElementById('modal').close(); }
document.getElementById('modal').addEventListener('click', function (e) {
  if (e.target === this) this.close();
});
</script>
<footer class="container footer">
  Media Manager Lite {{.BuildVersion}} · <a href="/api/health">health</a> · <a href="/api/version">version</a>
</footer>
</body>
</html>{{end}}
