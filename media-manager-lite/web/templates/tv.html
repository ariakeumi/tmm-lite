{{define "content"}}
<h1>电视剧</h1>
{{if not .Shows}}
  <section class="panel"><p class="muted empty">还没有电视剧——请先在
  <a href="/libraries">媒体库</a>页面扫描一个电视剧库。</p></section>
{{else}}
<table class="libraries">
  <thead><tr><th>标题</th><th>季数</th><th>集数</th><th>TMDB</th><th>状态</th></tr></thead>
  <tbody>
    {{range .Shows}}
    <tr>
      <td><a href="/tv/shows/{{.ID}}">{{.Title}}</a></td>
      <td>{{.SeasonCount}}</td>
      <td>{{.EpisodeCount}}</td>
      <td>{{if .TMDBID}}{{.TMDBID}}{{else}}<span class="muted">未匹配</span>{{end}}</td>
      <td>{{.AiredStatus}}</td>
    </tr>
    {{end}}
  </tbody>
</table>
{{end}}
{{end}}
