{{define "content"}}
<h1>电影</h1>

{{if not .HasLibraries}}
  <section class="panel"><p class="muted empty">还没有媒体库——请先在
  <a href="/settings">设置</a>页面添加并扫描。</p></section>
{{else}}
  {{range .Sections}}
  <section class="panel">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: .5rem;">
      <h2 style="margin: 0;">匹配 · {{.Library.Name}}</h2>
      <button type="button"
        hx-post="/api/libraries/{{.Library.ID}}/scan"
        hx-swap="none"
        hx-on::after-request="if(event.detail.successful) setTimeout(() => window.location.reload(), 1500)">扫描</button>
    </div>
    {{if not .Rows}}
      <p class="muted empty">尚未扫描到媒体文件——请先在
      <a href="/settings">设置</a>页面执行扫描。</p>
    {{else}}
    <table class="libraries">
      <thead>
        <tr><th>文件</th><th>解析结果</th><th>状态</th><th>候选 / 操作</th></tr>
      </thead>
      <tbody>
        {{range .Rows}}{{template "match_row" .}}{{end}}
      </tbody>
    </table>
    {{end}}
  </section>
  {{end}}
{{end}}
{{end}}
