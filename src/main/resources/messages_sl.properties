wizard.disclaimer.long=tinyMediaManager je upravljalnik medijev, ki pomaga organizirati vašo medijsko knjižnico z omogočanjem preprostega dostopa do storitev tretjih oseb, kot so "The Movie Database (TMDB)", "TheTVDB.com", "Trakt.tv" in drugi.\ntinyMediaManager sam po sebi ne ponuja nobene vrste metapodatkov ali vsebin za prenos – deluje le kot povezovalnik med vašim računalnikom in storitvami, ki ponujajo tovrstne podatke.\n\ntinyMediaManager je razvit pod licenco Apache v2 (https://www.apache.org/licenses/LICENSE-2.0) in uporablja druge odprtokodne komponente.\nTo orodje razvija in testira več uporabnikov, vendar lahko še vedno vsebuje hrošče, ki lahko izbrišejo/uničijo vašo medijsko knjižnico. Vedno poskrbite za varnostno kopiranje svojih podatkov. Ne prevzemamo odgovornosti za kakršno koli izgubo podatkov, ki bi jo povzročilo to orodje!\n\nPROGRAMSKA OPREMA JE NA VOLJO "TAKŠNA, KOT JE", BREZ KAKRŠNEGA KOLI JAMSTVA, IZRECNEGA ALI NAZNAČENEGA, VKLJUČNO Z, VENDAR NE OMEJENO NA JAMSTVA ZA PRODAJO, PRIMERNOST ZA DOLOČEN NAMEN IN NEKRŠITEV. AVTORJI ALI IMETNIKI AVTORSKIH PRAVIC V NOBENEM PRIMERU NE ODGOVARJAJO ZA KAKRŠNE KOLI ZAHTEVKE, ŠKODO ALI DRUGO ODGOVORNOST, NAJSI BO V POGODBENI OBLIKI, ODŠKODNINSKI ODGOVORNOSTI ALI DRUGAČE, KI IZHAJA IZ, JE POVEZANA S PROGRAMSKO OPREMO ALI UPORABO ALI DRUGIM RAVNANJEM S PROGRAMSKO OPREMO."
