scraper.tmdb.hint=<html><h3>The Movie Database (TMDB)</h3><br />Največja brezplačna filmska podatkovna baza, ki jo vzdržuje skupnost. Zagotavlja metapodatke in grafično gradivo v številnih različnih jezikih.<br /><br />Razpoložljivi jeziki: Več.</html>
scraper.imdb.hint=<html><h3>Internet Movie Database (IMDb)</h3><br />Najbolj uporabljena zbirka podatkov o filmih po vsem svetu.<br />V vseh jezikih ne vsebuje vsebine/naslova/kratkega opisa. Te podatke lahko prenesete iz TMDB<br /><br />Razpoložljivi jeziki: Več</html>
scraper.ofdb.hint=<html><h3>Online Filmdatenbank (OFDb)</h3><br />Nemška filmska podatkovna baza, ki jo vzdržuje skupnost.<br /><br />Razpoložljivi jeziki: DE</html>
scraper.zelluloid.hint=<html><h3>Zelluloid.de</h3><br />Nemška filmska podatkovna baza.<br /><br />Razpoložljivi jeziki: DE</html>
scraper.moviemeter.hint=<html><h3>Moviemeter.nl</h3><br />Nizozemska filmska podatkovna baza.<br /><br />Razpoložljivi jeziki: NL</html>
scraper.rottentomatoes.hint=<html><h3>Rotten Tomatoes</h3><br />Ameriška filmska podatkovna baza.<br />Za starejše filme prek API-ja ne ponuja vsebine.<br /><br />Razpoložljivi jeziki: EN</html>
scraper.omdbapi.hint=<html><h3>Omdbapi.com</h3><br />OMDb API je spletna storitev RESTful za pridobivanje informacij o filmih. Vso vsebino in slike na spletnem mestu prispevajo in vzdržujejo naši uporabniki. <br /><br />TinyMediaManager ponuja omejen dostop do OMDb (10 klicov na 15 sekund). Če želite uporabljati OMDb brez teh omejitev, postanite podpornik OMDb (https://www.patreon.com/join/omdb).<br /><br />Razpoložljivi jeziki: EN</html>
scraper.trakt.hint=<html><h3>Trakt.tv</h3><br />Trakt.tv je platforma, ki omogoča marsikaj, predvsem pa beleži televizijske oddaje in filme, ki jih gledate. Zagotavlja tudi metapodatke za filme in televizijske oddaje.<br /><br />Razpoložljivi jeziki: EN</html>
scraper.universal_movie.hint=<html><h3>Univerzalni strgalnik filmov</h3><br />Meta strgalnik, ki omogoča zbiranje in združevanje podatkov iz drugih strgalnikov.<br /><br />Da bi ta strgalnik deloval, morate določiti <b>vsaj</b>, kateri strgalnik naj se uporabi za iskanje. Nato lahko izberete, kateri strgalnik naj se uporabi za vsako podprto polje metapodatkov. <b>Vse uporabljene strgalnike morate nastaviti posamično.</b></html>
scraper.universal_tvshow.hint=<html><h3>Univerzalni strgalnik TV-oddaj</h3><br />Meta strgalnik, ki omogoča zbiranje in združevanje podatkov iz drugih strgalnikov.<br /><br />Da bi ta strgalnik deloval, morate določiti <b>vsaj</b>, kateri strgalnik naj se uporabi za iskanje. Nato lahko izberete, kateri strgalnik naj se uporabi za vsako podprto polje metapodatkov. <b>Vse uporabljene strgalnike morate nastaviti posamično.</b></html>
scraper.mpdbtv.hint=<html><h3>MPDb.TV</h3><br />MPDb.TV je zasebni ponudnik metapodatkov za francosko govoreče uporabnike – za uporabo te storitve boste morda morali postati njihov član (več informacij na http://www.mpdb.tv/)<br /><br />Razpoložljivi jeziki: FR</html>
scraper.anidb.hint=<html><h3>aniDB</h3><br />AniDB pomeni Anime DataBase. AniDB je neprofitna podatkovna baza animacij (animejev), ki je prosto dostopna javnosti.</html>
scraper.tvdb.hint=<html><h3>TheTVDB</h3><br />Odprta podatkovna baza za televizijske navdušence. Ta strgalnik omogoča pridobivanje metapodatkov in grafičnega gradiva za TV-nanizanke</html>
scraper.animated.hint=<html><h3>Animirani filmski plakati</h3><br />kot so videni na http://forum.kodi.tv/showthread.php?tid=215727 :)</html>
scraper.fanarttv.hint=<html><h3>Fanart.tv</h3><br />Fanart.tv ponuja ogromno knjižnico grafičnega gradiva za filme, TV-oddaje in glasbo. To storitev lahko uporabljate z API-ključem, ki ga ponuja tinyMediaManager, če pa želite hitrejši dostop do gradiva, postanite VIP-član na fanart.tv (https://fanart.tv/vip/).</html>
scraper.fanarttv.clientKey=Osebni API-ključ
