scraper.trakt.hint=<html><h3>Trakt.tv</h3><br />Trakt.tv - это платформа, которая выполняет множество функций, но в первую очередь отслеживает сериалы и фильмы, которые вы смотрите. Она также предоставляет метаданные о фильмах и сериалах.<br /><br />Доступные языки: EN</html>
