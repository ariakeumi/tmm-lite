wizard.disclaimer.long=tinyMediaManager — это менеджер медиа, который помогает организовать вашу медиабиблиотеку, предоставляя удобный доступ к сторонним сервисам, таким как «The Movie Database (TMDB)», «TheTVDB.com», «Fanart.tv», «Trakt.tv» и другим.\n\ntinyMediaManager работает исключительно как инструмент управления и технический интерфейс. Обратите внимание: приложение самостоятельно не предоставляет и не хранит ни метаданные, ни изображения, ни информацию о фильмах. Программное обеспечение функционирует исключительно как потребитель различных онлайн-баз данных и сервисов.\n\nВсе сведения, полученные через этот инструмент, поступают от внешних сторонних провайдеров. Соответствующий поставщик данных всегда однозначно идентифицирован в приложении. Получая эти данные, вы подтверждаете, что к вам применяются условия использования и лицензионные политики соответствующего провайдера. tinyMediaManager не принимает на себя никакой ответственности за точность, легальность или доступность этого внешнего контента. Использование этих интерфейсов осуществляется на ваш собственный риск и подчиняется правилам провайдера.\n\ntinyMediaManager разрабатывается под лицензией Apache v2 (https://www.apache.org/licenses/LICENSE-2.0) и использует другие компоненты открытого источника. В этой версии tinyMediaManager селективно используется код, созданный с помощью ИИ — каждый раздел лично проверен и верифицирован нашими разработчиками для обеспечения наших стандартов качества.\nЭтот инструмент разработан и тестируется многими пользователями, но всё ещё может содержать ошибки, которые могут удалить/уничтожить вашу медиабиблиотеку. Обязательно всегда создавайте резервные копии ваших данных. Мы не ответственны за любую потерю данных, вызванную этим инструментом!\n\nПРОГРАММНОЕ ОБЕСПЕЧЕНИЕ ПРЕДОСТАВЛЯЕТСЯ «КАК ЕСТЬ», БЕЗ КАКИХ-ЛИБО ГАРАНТИЙ, ЯВНЫХ ИЛИ ПОДРОЗУМЕВАЕМЫХ, ВКЛЮЧАЯ, НО НЕ ОГРАНИЧИВАЯСЬ ГАРАНТИЯМИ КОММЕРЗАЦИИ, ПРИГОДНОСТИ ДЛЯ ОПРЕДЕЛЕНОЙ ЦЕЛИ И НЕНАРУШЕНИЯ. НИ ПРИ КАКИХ ОБСТОЯТЕЛЬСТВАХ АВТОРЫ ИЛИ ВЛАДЕЛЬЦЫ КОММЕРЦИАЛЬНЫХ ПРАВ НЕ ОТВЕЧАЮТ ЗА КАКИЕ-ЛИБО ИСКЫ, УРОКИ ИЛИ ДРУГУЮ ОТВЕТСТВЕННОСТЬ, В НЕЗВИМАТЕЛЬНОЙ КОНТРАКТНОЙ, ПРАВООНАРУШИТЕЛЬНОЙ ИЛИ ИНОЙ НЕЗВИМАТЕЛЬНОЙ ОТВЕТСТВЕННОСТИ, ВЫЗАННОЙ ИЗ, ВЫХОДЯЩЕЙ ИЗ ИЛИ В СВЯЗИ С ПРОГРАММНЫМ ОБЕСПЕЧЕНИЕМ ИЛИ ИСПОЛЬЗОВАНИЕМ ИЛИ ДРУГОЙ ДЕЯТЕЛЬНОСТЬЮ В ПРОГРАММНОМ ОБЕСПЕЧЕНИИ.
