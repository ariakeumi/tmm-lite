scraper.tmdb.hint=<html><h3>База данных фильмов (TMDB)</h3><br />Крупнейшая бесплатная база данных фильмов, поддерживаемая сообществом. Содержит метаданные и изображения на разных языках.<br /><br />Доступные языки: Несколько.</html>
scraper.imdb.hint=<html><h3>База данных фильмов Интернета (IMDb)</h3><br />Наиболее часто используемая база данных фильмов во всём мире. Содержит сюжет/название/слоган не на всех языках.<br /><br />Доступные языки: Несколько</html>
scraper.ofdb.hint=<html><h3>Онлайн-база данных фильмов (OFDb)</h3><br />Немецкая база данных фильмов, созданная сообществом.<br /><br />Доступные языки: DE</html>
