scraper.rottentomatoes.hint=<html><h3>Rotten Tomatoes</h3><br />Американская база данных о фильмах.<br />Не предоставляет сюжетные линии старых фильмов через API.<br /><br />Доступные языки: EN</html>
scraper.imdb.filterUnwantedCategories.desc=<html>Фильтр нежелательных категории<br />Для фильмов: рассмотрится только категория Фильм<br />Для сериалов: рассмотрится только категория Сериалов<br /><br />Если хотите производить поиск других категорий, снимите флажок с этого параметра</html>
scraper.imdb.scrapeCollectionInfo.desc=<html>IMDb не содержит информации о съемочных площадках фильмов.<br />Если этот флажок установлен, для получения этой информации используется скрепер TMDB.</html>
