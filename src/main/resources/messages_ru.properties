scraper.omdbapi.hint=<html><h3>Omdbapi.com</h3><br />ODMDb API — это веб-сервис с архитектурой RESTful для получения информации о фильмах. Весь контент и изображения на сайте предоставлены и поддерживаются нашими пользователями. <br /><br />TinyMediaManager предоставляет ограниченный доступ к OMDb (10 запросов в 15 секунд). Если вы хотите использовать OMDb с более широкими возможностями, станьте спонсором OMDb (https://www.patreon.com/join/omdb).<br /><br />Доступные языки: EN</html>
