scraper.universal_tvshow.hint=<html><h3>Универсальный скрепер для сериалов</h3><br />Мета скрепер, который позволяет собирать и объединять данные из других скреперов.<br /><br />Чтобы этот скрепер работал, необходимо указать <b>по крайней мере</b> какой скрепер следует использовать для поиска. После этого вы можете выбрать, какой скрепер следует использовать для каждого поддерживаемого поля метаданных. <b>Вам необходимо настроить все используемые скреперы индивидуально.</b></html>
scraper.mpdbtv.hint=<html><h3>MPDb.TV</h3><br />MPDb.TV - это частный поставщик метаданных для франкоязычных пользователей. Для использования этого сервиса может потребоваться регистрация (подробнее на сайте http://www.mpdb.tv/)<br /><br />Доступные языки: FR</html>
scraper.opensubtitles2.machineTranslated=Включить субтитры с машинным переводом
scraper.ffmpeg.hint=<html><h3>FFmpeg</h3><br />Провайдер FFmpeg artwork - это мета-провайдер, который использует локальную установку FFmpeg для извлечения нескольких стоп-кадров из ваших видеофайлов</html>
scraper.anidb.hint=<html><h3>aniDB</h3><br />AniDB расшифровывается как Anime DataBase. AniDB - это некоммерческая база данных аниме, открытая для общего доступа.</html>
scraper.universal_movie.hint=<html><h3>Универсальный скрепер для фильмов</h3><br />Мета скрепер, который позволяет собирать и объединять данные из других скреперов.<br /><br />Чтобы этот скрепер работал, необходимо указать<b>по крайней мере</b> какой скрепер следует использовать для поиска. После этого вы можете выбрать, какой скрепер следует использовать для каждого поддерживаемого поля метаданных. <b>Вам необходимо настроить все используемые скреперы индивидуально.</b></html>
scraper.ffmpeg.type=Используйте этот скрепер для следующих типов изображений
scraper.fanarttv.hint=<html><h3>Fanart.tv</h3><br />Fanart.tv предоставляет огромную библиотеку иллюстраций к фильмам, сериалам и музыкальным произведениям. Этот сервис можно использовать с помощью ключа API, который предлагает tinyMediaManager, но если вы хотите получить более быстрый доступ к иллюстрациям, вам нужно стать VIP-пользователем на сайте fanart.tv (https://fanart.tv/vip/).</html>
