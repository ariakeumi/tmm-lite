Settings.imagecachesize=Nuotraukos dydis
Settings.imagecachesize.small=vaizdų mastelio keitimas iki 400 px ilgio pusės raiškos. Naudinga tinyMediaManager įrenginiams, kurių ekrano skiriamoji geba maža (pvz., HD/WXGA). Mažiausias vaizdų failų dydis.
