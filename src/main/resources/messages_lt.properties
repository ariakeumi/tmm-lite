wizard.greeting.header=Sveiki atvykę į tinyMediaManager diegimo vedlį
wizard.greeting.text=Šis vedlys padės jums atlikti pagrindinę tinyMediaManager sąranką.\n\nPagrindinėje tinyMediaManager sąrankoje yra tik dažniausiai pasitaikantys nustatymai, kurių prireiks pirmam paleidimui - visus nustatymus rasite per mygtuką „Nustatymai“.
wizard.import=Duomenų importavimas iš kito tinyMediaManager įrenginio
wizard.datasource.hint=Nurodykite aplankus, kuriuose tinyMediaManager turėtų ieškoti jūsų vaizdo įrašų failų.
wizard.disclaimer=Atsakomybės apribojimas
wizard.disclaimer.long=tinyMediaManager yra medijos tvarkymo programa, padedanti organizuoti jūsų medijos biblioteką, suteikdama patogią prieigą prie trečiųjų šalių paslaugų, tokių kaip „The Movie Database (TMDB)“, „TheTVDB.com“, „Fanart.tv“, „Trakt.tv“ ir kitų.\n\ntinyMediaManager veikia tik kaip valdymo įrankis ir techninė sąsaja. Atkreipkite dėmesį, kad pati programa neteikia ir netalpina jokių metaduomenų, vaizdų ar informacijos apie filmus. Programinė įranga veikia tik kaip įvairių internetinių duomenų bazių ir paslaugų naudotoja.\n\nVisa informacija, gaunama naudojant šį įrankį, yra gaunama iš išorinių trečiųjų šalių paslaugų teikėjų. Atitinkamas duomenų teikėjas programoje visada yra aiškiai nurodytas. Gaudami šiuos duomenis, jūs pripažįstate, kad taikomos atitinkamo paslaugų teikėjo naudojimo sąlygos ir licencijavimo politika. tinyMediaManager neprisiima jokios atsakomybės už šio išorinio turinio tikslumą, teisėtumą ar prieinamumą. Šių sąsajų naudojimas vykdomas jūsų pačių rizika ir laikantis paslaugų teikėjo gairių.\n\ntinyMediaManager yra kuriama pagal Apache v2 licenciją (https://www.apache.org/licenses/LICENSE-2.0) ir naudoja kitus atvirojo kodo komponentus. Šioje tinyMediaManager versijoje pasirinktinai naudojamas dirbtinio intelekto pagalba generuotas kodas – kiekviena jo dalis buvo asmeniškai peržiūrėta ir patikrinta mūsų kūrėjų, siekiant užtikrinti mūsų kokybės standartus.\nŠį įrankį kuria ir testuoja keli naudotojai, tačiau jame vis dar gali būti klaidų, kurios gali ištrinti arba sugadinti jūsų medijos biblioteką. Būtinai visada kurkite atsargines savo duomenų kopijas. Mes neatsakome už jokį duomenų praradimą, kurį sukėlė šis įrankis!\n\nPROGRAMINĖ ĮRANGA PATEIKIAMA „TOKIA, KOKIA YRA“, BE JOKIŲ AIŠKIAI IŠREIKŠTŲ AR NUMANOMŲ GARANTIJŲ, ĮSKAITANT, BET NEAPSIRIBOJANT, TINKAMUMO PREKYBAI, TINKAMUMO KONKREČIAM TIKSLUI IR NEPAŽEIDIMO GARANTIJOMIS. JOKIU ATVEJU AUTORIAI AR AUTORIŲ TEISIŲ TURĖTOJAI NEBUS ATSAKINGI UŽ JOKIUS REIKALAVIMUS, ŽALĄ AR KITĄ ATSAKOMYBĘ, KYLANČIĄ DĖL SUTARTIES, DELIKTO AR KITAIP, SUSIJUSIĄ SU PROGRAMINE ĮRANGA, JOS NAUDOJIMU AR KITAIS SU JA SUSIJUSIAIS VEIKSMAIS.
