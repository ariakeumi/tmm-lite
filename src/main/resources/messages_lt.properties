scraper.tmdb.hint=<html><h3>Filmų duomenų bazė (TMDB)</h3><br />Didžiausia nemokama filmų duomenų bazė, kurią prižiūri bendruomenė. Joje pateikiami metaduomenys ir iliustracijos daugeliu skirtingų kalbų.<br /><br />Galimos kalbos: įvairios.</html>
scraper.imdb.hint=<html><h3>Internet Movie Database (IMDb)</h3><br />Daugiausiai naudojama filmų duomenų bazė visame pasaulyje. Ne visomis kalbomis turi siužetą, pavadinimą ar šūkį.<br /><br />Prieinamos kalbos: įvairios</html>
scraper.ofdb.hint=<html><h3>Online Filmdatenbank (OFDb)</h3><br />Bendruomenės valdoma vokiečių filmų duomenų bazė.<br /><br />Prieinamos kalbos: DE</html>
scraper.zelluloid.hint=<html><h3>Zelluloid.de</h3><br />Vokiečių filmų duomenų bazė.<br /><br />Prieinamos kalbos: DE</html>
scraper.rottentomatoes.hint=<html><h3>Rotten Tomatoes</h3><br />Amerikiečių filmų duomenų bazė.<br />Per API nepateikia senesnių filmų siužeto.<br /><br />Prieinamos kalbos: EN</html>
scraper.omdbapi.hint=<html><h3>Omdbapi.com</h3><br />OMDb API yra RESTful internetinė paslauga, skirta gauti filmų informaciją. Visą svetainės turinį ir vaizdus pateikia bei prižiūri vartotojai. <br /><br />tinyMediaManager siūlo ribotą prieigą prie OMDb (10 užklausų per 15 sekundžių). Jei norite naudoti OMDb be šio apribojimo, turėtumėte tapti OMDb rėmėju (https://www.patreon.com/join/omdb).<br /><br />Prieinamos kalbos: EN</html>
scraper.trakt.hint=<html><h3>Trakt.tv</h3><br />Trakt.tv yra platforma, atliekanti daug funkcijų, tačiau pirmiausia ji seka jūsų žiūrimus serialus ir filmus. Ji taip pat teikia filmų ir serialų metaduomenis.<br /><br />Prieinamos kalbos: EN</html>
scraper.universal_movie.hint=<html><h3>Universal movie scraper</h3><br />Meta duomenų rinkiklis, leidžiantis rinkti ir sujungti duomenis iš kitų rinkiklių.<br /><br />Kad šis rinkiklis veiktų, turite nurodyti <b>bent jau</b>, kuris rinkiklis turėtų būti naudojamas paieškai. Po to galite pasirinkti, kuris rinkiklis turėtų būti naudojamas kiekvienam palaikomam metaduomenų laukui. <b>Visi naudojami rinkikliai turi būti nustatyti individualiai.</b></html>
scraper.universal_tvshow.hint=<html><h3>Universal TV show scraper</h3><br />Meta duomenų rinkiklis, leidžiantis rinkti ir sujungti duomenis iš kitų rinkiklių.<br /><br />Kad šis rinkiklis veiktų, turite nurodyti <b>bent jau</b>, kuris rinkiklis turėtų būti naudojamas paieškai. Po to galite pasirinkti, kuris rinkiklis turėtų būti naudojamas kiekvienam palaikomam metaduomenų laukui. <b>Visi naudojami rinkikliai turi būti nustatyti individualiai.</b></html>
scraper.mpdbtv.hint=<html><h3>MPDb.TV</h3><br />MPDb.TV yra privatus metaduomenų teikėjas prancūzakalbiams vartotojams – norint naudotis šia paslauga, gali tekti tapti nariu (daugiau informacijos: http://www.mpdb.tv/)<br /><br />Prieinamos kalbos: FR</html>
scraper.anidb.hint=<html><h3>aniDB</h3><br />AniDB reiškia Anime DataBase. AniDB yra ne pelno siekianti anime duomenų bazė, viešai ir nemokamai prieinama visiems.</html>
scraper.tvdb.hint=<html><h3>TheTVDB</h3><br />Atvira duomenų bazė televizijos gerbėjams. Šis rinkiklis gali gauti TV serialų metaduomenis ir iliustracijas</html>
scraper.fanarttv.hint=<html><h3>Fanart.tv</h3><br />Fanart.tv teikia didžiulę filmų, serialų ir muzikos iliustracijų biblioteką. Šia paslauga galima naudotis su tinyMediaManager siūlomu API raktu, tačiau jei norite greitesnės prieigos prie iliustracijų, turėtumėte tapti VIP nariu svetainėje fanart.tv (https://fanart.tv/vip/).</html>
