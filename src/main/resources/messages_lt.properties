Settings.imagecachetype.quality=kokybiškai masteliais keisti vaizdus. Šį tipą reikėtų naudoti kartu su mažo dydžio talpyklos vaizdų dydžiu, kad būtų išvengta artefaktų. Naudojant šį talpyklos tipą, užtruks šiek tiek laiko, kol bus sukurta talpykla.
Settings.imagecachetype.ultra_quality=vaizdus mastelio keitimas naudojant dar geresnį algoritmą, kad būtų užtikrinta aukščiausia kokybė. Šiam talpyklos tipui reikės daug apdorojimo laiko.
