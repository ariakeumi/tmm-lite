scraper.omdbapi.hint=<html><h3>Omdbapi.com</h3><br />A API do OMDb é um serviço web RESTful para obter informações sobre filmes. Todo o conteúdo e imagens do site são contribuídos e mantidos pelos usuários. <br /><br />O tinyMediaManager oferece acesso limitado ao OMDb (10 chamadas por 15 segundos). Se quiser usar o OMDb com mais do que esse acesso restrito, considere tornar-se apoiador do OMDb (https://www.patreon.com/join/omdb).<br /><br />Idiomas disponíveis: EN</html>
scraper.trakt.hint=<html><h3>Trakt.tv</h3><br />O Trakt.tv é uma plataforma que faz muitas coisas, mas principalmente registra as séries de TV e filmes que você assiste. Também fornece metadados para filmes e séries de TV.<br /><br />Idiomas disponíveis: EN</html>
scraper.universal_movie.hint=<html><h3>Coletor universal de filmes</h3><br />Um metacoletor que permite coletar e combinar dados de outros coletores.<br /><br />Para que este coletor funcione, você precisa especificar <b>pelo menos</b> qual coletor deve ser usado para a busca. Depois disso, você pode escolher qual coletor deve ser usado para cada campo de metadados compatível. <b>Você precisa configurar todos os coletores utilizados individualmente.</b></html>
# TVSHOWS
scraper.anidb.hint=<html><h3>aniDB</h3><br />AniDB significa Banco de Dados de Anime. O AniDB é um banco de dados de anime sem fins lucrativos, de acesso livre ao público.</html>
scraper.tvdb.hint=<html><h3>TheTVDB</h3><br />Um banco de dados aberto para fãs de televisão. Este coletor é capaz de coletar metadados e arte de séries de TV</html>
# ARTWORK
scraper.animated.hint=<html><h3>Pôsteres de Filmes Animados</h3><br />como visto em http://forum.kodi.tv/showthread.php?tid=215727 :)</html>
scraper.fanarttv.hint=<html><h3>Fanart.tv</h3><br />O Fanart.tv oferece uma vasta biblioteca de arte para filmes, séries de TV e música. Este serviço pode ser utilizado com a chave de API que o tinyMediaManager disponibiliza, mas se quiser acesso mais rápido à arte, considere tornar-se VIP no fanart.tv (https://fanart.tv/vip/).</html>
# TRAILER
scraper.hd-trailers.hint=<html><h3>hd-trailers.net</h3>Coletor para hd-trailers.net, capaz de coletar trailers</html>
# SUBTITLES
