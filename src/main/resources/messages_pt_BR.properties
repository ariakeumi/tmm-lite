wizard.disclaimer.long=O tinyMediaManager é um gerenciador de mídia que ajuda a organizar sua biblioteca de mídia, fornecendo acesso fácil a serviços de terceiros como "The Movie Database (TMDB)", "TheTVDB.com", "Fanart.tv", "Trakt.tv" e outros.\n\nO tinyMediaManager atua exclusivamente como uma ferramenta de gerenciamento e interface técnica. Observe que o aplicativo em si não fornece nem hospeda metadados, imagens ou informações sobre filmes. O software funciona exclusivamente como consumidor de diversos bancos de dados e serviços online.\n\nTodas as informações obtidas por meio desta ferramenta são provenientes de provedores externos de terceiros. O respectivo provedor de dados é claramente identificável no aplicativo a qualquer momento. Ao obter esses dados, você reconhece que os termos de uso e as políticas de licenciamento do respectivo provedor se aplicam. O tinyMediaManager não assume responsabilidade pela precisão, legalidade ou disponibilidade deste conteúdo externo. O uso dessas interfaces é por sua própria conta e risco e está sujeito às diretrizes do provedor.\n\nO tinyMediaManager é desenvolvido sob a licença Apache v2 (https://www.apache.org/licenses/LICENSE-2.0) e utiliza outros componentes de código aberto. Nesta versão do tinyMediaManager, código assistido por IA é utilizado de forma seletiva — cada seção foi pessoalmente revisada e verificada por nossos desenvolvedores para garantir nossos padrões de qualidade.\n\nEsta ferramenta é desenvolvida e testada por múltiplos usuários, mas ainda pode conter bugs que podem excluir/destruir sua biblioteca de mídia. Certifique-se de sempre fazer backup dos seus dados. Não nos responsabilizamos por qualquer perda de dados causada por esta ferramenta!\nO SOFTWARE É FORNECIDO "NO ESTADO EM QUE SE ENCONTRA", SEM GARANTIA DE QUALQUER TIPO, EXPRESSA OU IMPLÍCITA, INCLUINDO, MAS NÃO SE LIMITANDO ÀS GARANTIAS DE COMERCIALIZAÇÃO, ADEQUAÇÃO A UMA FINALIDADE ESPECÍFICA E NÃO VIOLAÇÃO. EM NENHUMA CIRCUNSTÂNCIA OS AUTORES OU DETENTORES DOS DIREITOS AUTORAIS SERÃO RESPONSÁVEIS POR QUALQUER RECLAMAÇÃO, DANO OU OUTRA RESPONSABILIDADE, SEJA EM AÇÃO CONTRATUAL, EXTRACONTRATUAL OU DE OUTRA FORMA, DECORRENTE DE, OU EM CONEXÃO COM O SOFTWARE OU O USO OU OUTRAS NEGOCIAÇÕES NO SOFTWARE.
