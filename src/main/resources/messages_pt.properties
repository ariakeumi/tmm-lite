wizard.disclaimer.long=O tinyMediaManager é um gestor de multimédia que ajuda a organizar a tua biblioteca de multimédia, proporcionando acesso fácil a serviços de terceiros como "The Movie Database (TMDB)", "TheTVDB.com", "Fanart.tv", "Trakt.tv" e outros.\n\nO tinyMediaManager funciona apenas como ferramenta de gestão e interface técnica. A própria aplicação não fornece nem aloja metadados, imagens ou informações sobre filmes. O software atua exclusivamente como consumidor de várias bases de dados e serviços online.\n\nTodas as informações obtidas através desta ferramenta provêm de fornecedores externos. O respetivo fornecedor de dados está sempre claramente identificado na aplicação. Ao obter estes dados, reconheces que se aplicam os termos de utilização e as políticas de licenciamento do respetivo fornecedor. O tinyMediaManager não assume qualquer responsabilidade pela exatidão, legalidade ou disponibilidade deste conteúdo externo. A utilização destas interfaces é da tua inteira responsabilidade e está sujeita às orientações do fornecedor.\n\nO tinyMediaManager é desenvolvido ao abrigo da licença Apache v2 (https://www.apache.org/licenses/LICENSE-2.0) e utiliza outros componentes de código aberto. Nesta versão do tinyMediaManager, é utilizado seletivamente código assistido por IA — todas as secções foram revistas e verificadas pessoalmente pelos nossos programadores para garantir os nossos padrões de qualidade.\nEsta ferramenta é desenvolvida e testada por vários utilizadores, mas pode ainda conter erros capazes de eliminar ou destruir a tua biblioteca de multimédia. Faz sempre uma cópia de segurança dos teus dados. Não nos responsabilizamos por qualquer perda de dados causada por esta ferramenta!\n\nO SOFTWARE É FORNECIDO "TAL COMO ESTÁ", SEM GARANTIAS DE QUALQUER TIPO, EXPRESSAS OU IMPLÍCITAS, INCLUINDO, SEM LIMITAÇÃO, AS GARANTIAS DE COMERCIALIZAÇÃO, ADEQUAÇÃO A UMA FINALIDADE ESPECÍFICA E NÃO VIOLAÇÃO. EM CIRCUNSTÂNCIA ALGUMA OS AUTORES OU TITULARES DOS DIREITOS DE AUTOR SERÃO RESPONSÁVEIS POR QUALQUER RECLAMAÇÃO, DANO OU OUTRA RESPONSABILIDADE, SEJA NUMA AÇÃO CONTRATUAL, EXTRACONTRATUAL OU DE OUTRA NATUREZA, DECORRENTE DO SOFTWARE, DA SUA UTILIZAÇÃO OU DE OUTRAS OPERAÇÕES RELACIONADAS COM O SOFTWARE, OU LIGADA A ESTES.
