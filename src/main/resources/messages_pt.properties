scraper.omdbapi.hint=<html><h3>Omdbapi.com</h3><br />A API OMDb é um serviço Web RESTful para obter informações sobre filmes. Todo o conteúdo e todas as imagens do site são fornecidos e mantidos pelos utilizadores. <br /><br />O tinyMediaManager oferece acesso limitado à OMDb (10 pedidos a cada 15 segundos). Para utilizar a OMDb sem esta limitação, deves tornar-te patrono da OMDb (https://www.patreon.com/join/omdb).<br /><br />Idiomas disponíveis: EN</html>
scraper.trakt.hint=<html><h3>Trakt.tv</h3><br />O Trakt.tv é uma plataforma com várias funcionalidades, mas serve sobretudo para registar as séries e os filmes que vês. Também fornece metadados de filmes e séries.<br /><br />Idiomas disponíveis: EN</html>
scraper.universal_movie.hint=<html><h3>Fonte universal de metadados de filmes</h3><br />Uma fonte agregadora que permite recolher e combinar dados de outras fontes de metadados.<br /><br />Para esta fonte funcionar, tens de indicar <b>pelo menos</b> a fonte de metadados a utilizar na pesquisa. Depois, podes escolher a fonte a utilizar para cada campo de metadados suportado. <b>Tens de configurar individualmente todas as fontes utilizadas.</b></html>
# TVSHOWS
scraper.anidb.hint=<html><h3>aniDB</h3><br />AniDB significa Anime DataBase. É uma base de dados de anime, sem fins lucrativos, aberta livremente ao público.</html>
scraper.tvdb.hint=<html><h3>TheTVDB</h3><br />Uma base de dados aberta para fãs de televisão. Esta fonte consegue obter metadados e imagens de séries</html>
# ARTWORK
scraper.animated.hint=<html><h3>Animated Movie Posters</h3><br />Tal como apresentado em http://forum.kodi.tv/showthread.php?tid=215727 :)</html>
scraper.fanarttv.hint=<html><h3>Fanart.tv</h3><br />O Fanart.tv disponibiliza uma enorme biblioteca de imagens de filmes, séries e música. Este serviço pode ser utilizado com a chave da API fornecida pelo tinyMediaManager, mas, para teres acesso mais rápido às imagens, deves tornar-te VIP no fanart.tv (https://fanart.tv/vip/).</html>
# TRAILER
scraper.hd-trailers.hint=<html><h3>hd-trailers.net</h3>Fonte de metadados do hd-trailers.net que permite obter trailers</html>
# SUBTITLES
